services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1-full
    container_name: datathon-mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    working_dir: /mlflow
    entrypoint: []
    # "*" desliga a validação de Host (rede Docker usa hostname do serviço, ex.: mlflow:5000).
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:///mlflow.db
      - --default-artifact-root=/mlflow/artifacts
      - --serve-artifacts
      - "--allowed-hosts=*"
    networks:
      - observability
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  train:
    build:
      context: .
      dockerfile: src/models/Dockerfile
    image: datathon-train-models
    pull_policy: build
    container_name: datathon-train-models
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    networks:
      - observability
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/serving/Dockerfile
    image: datathon-predict-api
    pull_policy: build
    container_name: datathon-predict-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./.data:/app/.data
    networks:
      - observability
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: datathon-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    depends_on:
      - api
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: datathon-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - observability
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: datathon-promtail
    volumes:
      - ./logs:/var/log/api  # Mapeia a pasta de logs da sua API
      - ./docker/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: datathon-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # dashboards.yml + json/main_dashboard.json (provisioning de painéis)
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  mlflow_data:

networks:
  observability:
    driver: bridge