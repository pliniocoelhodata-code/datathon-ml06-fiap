# Pipeline DVC — implementar estágios
stages:
  train_baseline:
    cmd: python -m src.models.baseline
    deps:
      - data/raw/stock_data.csv
      - src/models/baseline.py
    metrics:
      - mlruns/
  train_lstm:
    cmd: python -m src.models.train
    deps:
      - data/raw/stock_data.csv
      - src/models/train.py
      - src/features/feature_engineering.py

  monitor_drift:
    cmd: make drift
    deps:
      - data/raw/stock_data.csv
      - data/monitoring/current_requests.csv
      - src/monitoring/drift.py
      - configs/monitoring_config.yaml
    outs:
      - data/monitoring/drift_report.html
