[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-grupo"
version = "0.1.0"
description = "Projeto integrador Datathon — Fase 05 (LLMs e agentes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "dvc>=3.67.1"
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "joblib>=1.3.0",
    "mlflow>=2.10",
    "tensorflow==2.21.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "matplotlib>=3.8.0",
    "evidently>=0.4.0",
    "prometheus-client>=0.19",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "datasets>=2.16",
    "ragas>=0.1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26",
    "yfinance>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pandera>=0.18",
    "ruff>=0.2.0",
    "mypy>=1.8",
    "bandit[toml]>=1.7",
    "pre-commit>=3.6",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
