[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-grupo"
version = "0.1.0"
description = "Projeto integrador Datathon — Fase 05 (LLMs e agentes)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Núcleo: API (serving) + pipeline de dados/treino já implementado no repo.
# Torch, LangChain, DVC, etc. não são importados pelo código atual — ficam em extras.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "yfinance>=1.2.0",
    "tensorflow>=2.16.1",
    "mlflow>=2.10",
    "fastapi>=0.109",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19",
    "make>=0.1.6.post2",
]

[project.optional-dependencies]
# Drift Evidently + testes em tests/test_drift.py
monitoring = [
    "evidently>=0.7.21",
]
# Plots e RAGAS (evaluation/)
evaluation = [
    "matplotlib>=3.8.0",
    "datasets>=2.16",
    "ragas>=0.1.0",
]
# src/security/guardrails.py
security = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# Módulos src/agent/* (stubs — quando implementar)
agent = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "faiss-cpu>=1.8.0",
    "langchain-openai>=0.1.0",
    "httpx>=0.26",
]
# Versionamento de dados / pipelines (CLI; não há import dvc no código)
mlops = [
    "dvc>=3.67.1",
]
# Migrações quando houver alembic.ini / versions/
db = [
    "alembic>=1.18.4",
]
# src/serving/core/monitoring.py (init_sentry)
observability = [
    "sentry-sdk>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pandera>=0.18",
    "ruff>=0.2.0",
    "mypy>=1.8",
    "bandit[toml]>=1.7",
    "pre-commit>=3.6",
    "types-PyYAML",
    "faker>=24.0",
    "evidently>=0.7.21"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "src/serving/core/monitoring.py",
]

[dependency-groups]
dev = [
    "evidently>=0.7.21",
    "faker>=40.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
