apiVersion: 1

groups:
  - name: DatathonAlerts
    rules:
      # 1. Alerta de Drift Crítico
      - alert: CriticalModelDrift
        expr: model_drift_share > 0.2
        for: 5m
        labels:
          severity: critical
          team: ml-ops
        annotations:
          summary: "Drift detectado no modelo de Stocks"
          description: "O share de drift ultrapassou o limite de 0.2 (PSI > 0.2). O modelo pode estar degradando e um retreino automático pode ser necessário."

      # 2. Alerta de Latência de Predição
      - alert: HighPredictionLatency
        expr: rate(prediction_duration_seconds_sum[5m]) / rate(prediction_duration_seconds_count[5m]) > 2
        for: 2m
        labels:
          severity: warning
          team: platform-eng
        annotations:
          summary: "Latência de predição elevada"
          description: "A média de latência das predições está acima de 2 segundos. Verifique o uso de recursos do container."

      # 3. Alerta de Taxa de Erros na API
      - alert: HighPredictionErrorRate
        expr: (rate(prediction_requests_total{status!="success"}[5m]) / rate(prediction_requests_total[5m])) * 100 > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro da API acima de 10%"
          description: "O endpoint /predict está retornando erros 4xx/5xx em volume anormal."