server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: predict-api
          __path__: /var/log/api/*.log

  - job_name: docker-api-stdout
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /datathon-predict-api
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container_name
        replacement: "${1}"
        action: replace
